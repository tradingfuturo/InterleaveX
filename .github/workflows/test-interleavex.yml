name: InterleaveX CI
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    branches: [ main ]
jobs:
  build-and-test:
    name: Build and test InterleaveX
    strategy:
      matrix:
        platform: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.platform }}
    env:
      COYOTE_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v2
      - name: Check build output layout
        run: ./Scripts/check-build-layout.ps1
        shell: pwsh
      - name: Check the script helpers
        run: ./Scripts/check-script-helpers.ps1
        shell: pwsh
      - name: Setup NuGet.exe
        uses: NuGet/setup-nuget@v1
        with:
          nuget-version: '6.x'
      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup .NET 6.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Setup debugging tools
        if: ${{ matrix.platform == 'windows-latest' }}
        run: |
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/Procdump.zip -OutFile Procdump.zip
          7z x .\Procdump.zip -oexternal && rm Procdump.zip
          echo "PROCDUMP_PATH=$pwd\external" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh
      - name: Build InterleaveX projects
        run: ./Scripts/build.ps1 -ci -nuget
        shell: pwsh
      - name: Validate InterleaveX rewriting
        if: ${{ matrix.platform == 'windows-latest' }}
        run: ./Tests/compare-rewriting-diff-logs.ps1
        shell: pwsh
      - name: Run InterleaveX tests
        run: ./Scripts/run-tests.ps1 -ci
        shell: pwsh
      # Only the Windows leg packs, so it is the only one with packages to hand to the samples job.
      # Every other artifact is named after its platform: an artifact name has to be unique within a
      # run, and three matrix legs uploading under one name is a conflict, not a merge.
      - name: Archive InterleaveX NuGet packages
        if: ${{ matrix.platform == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: interleavex-nuget
          path: ./bin/Release/nuget
      - name: Archive InterleaveX binaries
        uses: actions/upload-artifact@v4
        with:
          name: interleavex-binaries-${{ matrix.platform }}
          path: ./bin
      - name: Archive test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interleavex-test-results-${{ matrix.platform }}
          path: ./Tests/**/TestResults
  build-and-test-samples:
    name: Build and test InterleaveX samples
    needs: build-and-test
    strategy:
      matrix:
        platform: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.platform }}
    env:
      COYOTE_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v2
      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # The samples restore InterleaveX from the local feed that NuGet.config points at, so the
      # packages are all this job needs from the build; the CLI comes from 'dotnet tool restore'.
      - name: Download InterleaveX NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: interleavex-nuget
          path: ./bin/Release/nuget
      - name: Build InterleaveX samples
        run: |
          ./Samples/Scripts/build.ps1 -local -nuget
          ./Samples/Scripts/build-tests.ps1 -local -nuget
        shell: pwsh
      - name: Test InterleaveX samples
        run: ./Samples/Scripts/run-tests.ps1
        shell: pwsh
